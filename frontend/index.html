<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomalies de Température par Département</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Températures mensuelles par département</h1>
        <p class="subtitle">Une courbe par année + normale 1991-2020 (cliquez sur la légende pour masquer/afficher)</p>

        <div class="field">
            <label for="departement">Département</label>
            <select id="departement" required></select>
        </div>

        <div id="graph-chargement" class="chargement hidden">Chargement du graphique…</div>
        <div id="graph-erreur" class="erreur hidden"></div>

        <div class="chart-wrapper">
            <canvas id="chart-temp"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
